syntax = "proto3";

package user_service.config.app;

option go_package = "github.com/zengo/user-service/gen/api/config/app;appcfg";

message Config {
  string kind = 1;
  optional string api_version = 2;
  Spec spec = 3;
}

message Spec {
  string default_display_name_prefix = 1;
  bool require_display_name = 2;
}
