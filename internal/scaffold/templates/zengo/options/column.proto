syntax = "proto3";

package zengo.options;

import "google/protobuf/descriptor.proto";

option go_package = "zengo/platform/api/zengo/options;options";

extend google.protobuf.FieldOptions {
  Column column = 50006;
}

message Column {
  string name = 1;
  string sql_type = 2;
  bool primary_key = 3;
  bool nullable = 4;
  bool unique = 5;
  string default_sql = 6;
  bool ignore = 7;
}
